<!doctype html>
<html lang="ru" xmlns:v-bind="http://www.w3.org/1999/xhtml" xmlns:v-on="http://www.w3.org/1999/xhtml">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
   <meta http-equiv="X-UA-Compatible" content="ie=edge">
   <link rel="stylesheet" href="css/main.css">
   <script defer src="js/main.js"></script>
   <script defer src="js/vue.js"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.5.17/vue.js"></script>
   <title>Product App</title>
</head>
<body>
<div id="app">
   <div class="product">

      <div class="product-image">
         <img v-bind:alt="altText" v-bind:src="image"/>
      </div>


      <div class="product-info">
         <h1>{{ title }}</h1>
         <p v-if="inStock">In Stock</p>
         <p v-else>Out of Stock</p>

         <ul>
            <li v-for="detail in details">{{ detail }}</li>
         </ul>

         <div class="color-box" v-for="(variant, index) in variants" :key="variant.variantId" :style="{ backgroundColor:variant.variantColor }" @mouseover="updateProduct(index)"></div>


      </div>

   </div>
</div>
</body>
</html>
